name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit must carry Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format='%b' "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with: git commit -s   (amend existing commits with: git rebase --signoff $base)"
            exit 1
          fi
          echo "All commits signed off."

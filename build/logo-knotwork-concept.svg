    <use href="#trefoil" stroke="#F4F0E5" stroke-width="30"/>

    <!-- Erase the three intersections before redrawing alternating bridges. -->
    <g fill="#F4F0E5" stroke="none">
      <circle cx="392.5" cy="431" r="43"/>
      <circle cx="631.5" cy="431" r="43"/>
      <circle cx="512" cy="638" r="43"/>

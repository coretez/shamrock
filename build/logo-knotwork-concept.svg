<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Shamrock Celtic knotwork concept</title>
  <desc>A one-color, three-crossing Irish trefoil knot with an integrated lower-left stem.</desc>

  <!-- Warm paper is preview-only; the production master will use transparency. -->
  <rect width="1024" height="1024" fill="#F4F0E5"/>

  <g stroke-linecap="round" stroke-linejoin="round">

      C 702.5 680.9 684.3 686.9 665.5 688.9 C 646.7 690.8 625.0 689.3 604.0 684.0
      C 583.0 678.7 560.3 669.3 539.7 656.9 C 519.0 644.5 498.1 628.0 480.2 609.5
      C 462.3 591.0 445.5 568.8 432.3 546.0 C 419.2 523.2 408.3 497.6 401.3 472.8
      C 394.2 448.1 390.4 421.7 389.9 397.6 C 389.5 373.5 392.8 349.2 398.7 328.3
